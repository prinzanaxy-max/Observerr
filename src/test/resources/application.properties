spring.datasource.url=jdbc:h2:mem:observerr_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

spring.flyway.enabled=false

jwt.secret=observerr-test-secret-minimum-32-chars
jwt.expiration=86400000
jwt.refresh-expiration=604800000
jwt.issuer=observerr-test

spring.data.redis.url=

webpush.vapid.public-key=
webpush.vapid.private-key=

cloudinary.cloud-name=
cloudinary.api-key=
cloudinary.api-secret=

spring.web.cors.allowed-origins=http://localhost:5173

auth.cookie.secure=false
auth.cookie.same-site=Lax
auth.cookie.path=/
auth.cookie.access-max-age=86400
auth.cookie.refresh-max-age=604800

app.frontend-base-url=http://localhost:5173

livekit.url=wss://test.livekit.cloud
livekit.api-key=test-livekit-api-key
livekit.api-secret=test-livekit-api-secret-at-least-32-characters
livekit.token-ttl-seconds=300
