spring.application.name=${SPRING_APPLICATION_NAME:observerr}

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

# HikariCP — size per replica against the database connection budget.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:300000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:60000}
spring.datasource.hikari.keepalive-time=${DB_POOL_KEEPALIVE_MS:120000}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}

# JPA / Hibernate (Flyway owns schema; Hibernate validates only)
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=${HIBERNATE_JDBC_BATCH_SIZE:50}
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.connect-retries=${FLYWAY_CONNECT_RETRIES:10}

# Server
server.port=${PORT:${SERVER_PORT:8080}}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# JWT Config
jwt.secret=${JWT_SECRET:observerr-local-dev-secret-min-32-chars}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}
jwt.issuer=${JWT_ISSUER:observerr}

# CORS
spring.web.cors.allowed-origins=${SPRING_WEB_CORS_ALLOWED_ORIGINS:http://localhost:5173,https://observerr-ui.pages.dev}

# Redis (optional locally — uses in-memory blocklist when unset)
spring.data.redis.url=${REDIS_URL:}

# Auth cookies
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
auth.cookie.path=${AUTH_COOKIE_PATH:/}
auth.cookie.access-max-age=${AUTH_COOKIE_ACCESS_MAX_AGE:86400}
auth.cookie.refresh-max-age=${AUTH_COOKIE_REFRESH_MAX_AGE:604800}

# Rate limiting (password change)
account.password-change.max-attempts=${ACCOUNT_PASSWORD_CHANGE_MAX_ATTEMPTS:5}
account.password-change.window-seconds=${ACCOUNT_PASSWORD_CHANGE_WINDOW_SECONDS:900}
rate-limit.auth.max-attempts=${RATE_LIMIT_AUTH_MAX_ATTEMPTS:20}
rate-limit.auth.window-seconds=${RATE_LIMIT_AUTH_WINDOW_SECONDS:60}
rate-limit.session.max-attempts=${RATE_LIMIT_SESSION_MAX_ATTEMPTS:10}
rate-limit.session.window-seconds=${RATE_LIMIT_SESSION_WINDOW_SECONDS:60}
rate-limit.integrity.max-attempts=${RATE_LIMIT_INTEGRITY_MAX_ATTEMPTS:10}
rate-limit.integrity.window-seconds=${RATE_LIMIT_INTEGRITY_WINDOW_SECONDS:60}
rate-limit.autosave.max-attempts=${RATE_LIMIT_AUTOSAVE_MAX_ATTEMPTS:120}
rate-limit.autosave.window-seconds=${RATE_LIMIT_AUTOSAVE_WINDOW_SECONDS:60}

# Push notifications (native Web Push / VAPID)
app.frontend-base-url=${APP_FRONTEND_BASE_URL:https://observerr-ui.pages.dev}
webpush.vapid.public-key=${VAPID_PUBLIC_KEY:}
webpush.vapid.private-key=${VAPID_PRIVATE_KEY:}
webpush.vapid.subject=${VAPID_SUBJECT:mailto:support@observerr.app}

# Exam lifecycle scheduler
exam.start-check-interval-ms=${EXAM_START_CHECK_INTERVAL_MS:60000}

# Multipart uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Cloudinary (profile pictures)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.folder=${CLOUDINARY_FOLDER:observerr/profile-pictures}
account.profile-picture.max-size-bytes=${ACCOUNT_PROFILE_PICTURE_MAX_SIZE_BYTES:5242880}

# LiveKit Cloud (required only for live media token issuance)
livekit.url=${LIVEKIT_URL:}
livekit.api-key=${LIVEKIT_API_KEY:}
livekit.api-secret=${LIVEKIT_API_SECRET:}
livekit.token-ttl-seconds=${LIVEKIT_TOKEN_TTL_SECONDS:300}

# Student results cache (Caffeine in-memory)
cache.student-results.ttl-seconds=${CACHE_STUDENT_RESULTS_TTL_SECONDS:300}
cache.student-results.max-size=${CACHE_STUDENT_RESULTS_MAX_SIZE:100}
